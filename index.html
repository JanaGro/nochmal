#toolbar{

#sheet{

#leftArea{

#columns,

#bottomScores{

#topScores{
margin-bottom:3px;

.header{

height:44px;
background:#f1f1f1;
color:#111;

align-items:center;

font-weight:bold;

.scoreCell,

.colorBottom,

.cross{

.startColumn{
box-shadow:

.colorScored{

height:44px;
border-radius:4px;
position:relative;
cursor:pointer;
overflow:hidden;
}

position:absolute;
left:50%;
top:50%;
transform:translate(-50%,-50%);
width:34px;
height:34px;
border-radius:50%;
background:rgba(255,255,255,0.18);
pointer-events:none;
z-index:1;
}

.cell.star .cellCircle{
display:none;
}

.green{
background:#a6cf4a;

.yellow{
background:#f4cf29;
}

.orange{
background:#ef9323;
}

.blue{
background:#76c6ef;
}

.red{
background:#ec3a8a;
}

.cell.star::before{
content:"★";
position:absolute;
left:50%;
top:46%;
transform:translate(-50%,-52%);
font-size:35px;

color:rgba(255,255,255,0.22);

-webkit-text-stroke:1.5px white;

pointer-events:none;

z-index:3;
}

.cell.checked::after,
.cell.checked::marker{

content:"";

position:absolute;

width:40px;
height:5px;

border-radius:999px;

left:50%;
top:50%;

transform-origin:center;

z-index:10;

}

.xmark{
position:absolute;
inset:0;
pointer-events:none;
z-index:10;
}

.xmark::before,
.xmark::after{

content:"";

position:absolute;

left:50%;
top:50%;

width:44px;
height:5px;

background:#111;

border-radius:999px;

transform-origin:center;

}

.xmark::before{
transform:translate(-50%,-50%) rotate(45deg);
}

.xmark::after{
transform:translate(-50%,-50%) rotate(-45deg);
}

.stars
.some(
s=>s[0]===rowIndex&&s[1]===colIndex
)
){
cell.classList.add("star");
}

cell.onclick=()=>{

if(
cell.classList.contains("checked")
){

cell.classList.remove("checked");

cell.querySelector(".xmark")?.remove();


save();
update();

return;

}

if(
!canCheckCell(cell)
){

return;

}

cell.classList.add("checked");

if(!cell.querySelector(".xmark")){
const x=document.createElement("div");
x.className="xmark";
cell.appendChild(x);
}

save();
update();

};

board.appendChild(cell);

});

});

for(let i=0;i<8;i++){

const joker=document.createElement("div");

joker.className="joker";

joker.textContent="!";

joker.onclick=()=>{

joker.classList.toggle("used");

save();
update();

};

jokerRow.appendChild(joker);

}

[
["green","colorGreen"],
["yellow","colorYellow"],
["blue","colorBlue"],
["red","colorRed"],
["orange","colorOrange"]
].forEach(item=>{

const color=item[0];
const css=item[1];

const row=document.createElement("div");
row.className="colorRow";

const top=document.createElement("div");
top.className="colorTop "+css;
top.dataset.color=color;

const topValue=document.createElement("span");
topValue.className="topValue";
topValue.textContent="5";

top.appendChild(topValue);

top.onclick=()=>{

top.classList.toggle("cross");

save();
update();

};

const bottom=document.createElement("div");
bottom.className="colorBottom "+css;

const bottomValue=document.createElement("span");
bottomValue.className="bottomValue";
bottomValue.textContent="3";

bottom.appendChild(bottomValue);

row.append(top);
row.append(bottom);

colorPanel.appendChild(row);

});

function canCheckCell(cell){

if(cell.classList.contains("checked")){
return true;
}

const allCells =
[...document.querySelectorAll(".cell")];

const checked =
allCells.filter(c=>
c.classList.contains("checked")
);

const index =
allCells.indexOf(cell);

const row =
Math.floor(index/15);

const col =
index%15;

if(checked.length===0){

return col===7;

}

const neighbors=[
[row-1,col],
[row+1,col],
[row,col-1],
[row,col+1]
];

for(const [r,c] of neighbors){

if(
r<0 ||
r>6 ||
c<0 ||
c>14
){
continue;
}

const neighbor=
allCells[r*15+c];

if(
neighbor.classList.contains("checked")
){
return true;
}

}

return false;

}

}

function showPopup(text){

const popup =
document.getElementById("popupMessage");

popup.textContent = text;
popup.style.display = "block";

setTimeout(()=>{

popup.style.display = "none";

},2000);

}

function save(){

const state={

cells:
[...document.querySelectorAll(".cell")]
.map(c=>c.classList.contains("checked")),

jokers:
[...document.querySelectorAll(".joker")]
.map(j=>j.classList.contains("used")),

columns:
[...document.querySelectorAll(".topScore")]
.map(s=>s.classList.contains("cross")),

colors:{}

};

document
.querySelectorAll(".colorTop")
.forEach(c=>{

state.colors[c.dataset.color]
=
c.classList.contains("cross");

});

localStorage.setItem(
getStorageKey(),
JSON.stringify(state)
);

}

function load(){

document
.querySelectorAll(".cell")
.forEach(cell=>{

cell.classList.remove("checked");

cell
.querySelectorAll(".xmark")
.forEach(x=>x.remove());

});

document
.querySelectorAll(".joker")
.forEach(joker=>{
joker.classList.remove("used");
});

document
.querySelectorAll(".topScore")
.forEach(score=>{
score.classList.remove("cross");
});

document
.querySelectorAll(".colorTop")
.forEach(color=>{
color.classList.remove("cross");
});

const state=
JSON.parse(
localStorage.getItem(
getStorageKey()
)||"null"
);

if(!state){
return;
}

document
.querySelectorAll(".cell")
.forEach((cell,index)=>{

if(state.cells?.[index]){

cell.classList.add("checked");

if(!cell.querySelector(".xmark")){
const x=document.createElement("div");
x.className="xmark";
cell.appendChild(x);
}

}

});

document
.querySelectorAll(".joker")
.forEach((joker,index)=>{

if(state.jokers?.[index]){

joker.classList.add("used");

}

});

document
.querySelectorAll(".topScore")
.forEach((score,index)=>{

if(state.columns?.[index]){

score.classList.add("cross");

}

});

document
.querySelectorAll(".colorTop")
.forEach(c=>{

if(
state.colors &&
state.colors[c.dataset.color]
){

c.classList.add("cross");

}

});

}

let scoreHidden=false;

function update(){

const cells=
[...document.querySelectorAll(".cell")];

let aoScore=0;

document
.querySelectorAll(".topScore")
.forEach(e=>
e.classList.remove("scored")
);

document
.querySelectorAll(".bottomScore")
.forEach(e=>
e.classList.remove("bottomScored")
);

for(let col=0;col<15;col++){

let complete=true;

for(let row=0;row<7;row++){

const index=row*15+col;

if(
!cells[index]
.classList
.contains("checked")
){
complete=false;
}

}

if(complete){

const topField =
document.querySelectorAll(".topScore")[col];

const bottomField =
document.querySelectorAll(".bottomScore")[col];

const crossed =
topField.classList.contains("cross");

if(crossed){

bottomField.classList.add("bottomScored");

}else{

topField.classList.add("scored");

}

aoScore+=
crossed
?
columnValues[col].b
:
columnValues[col].t;

}

}

let colorScore=0;
let completedColors=0;

document
.querySelectorAll(".colorTop")
.forEach(e=>{

e.classList.remove("colorScored");

const v=e.querySelector(".topValue");

if(v){
v.classList.remove("activeScore");
}

});

document
.querySelectorAll(".colorTop")
.forEach(e=>
e.classList.remove("colorBoxScored")
);

document
.querySelectorAll(".colorBottom")
.forEach(e=>
e.classList.remove("colorBoxScored")
);

Object.keys(colorValues)
.forEach(color=>{

let totalFields=0;
let checkedFields=0;

cells.forEach(cell=>{

if(
cell.classList.contains(color)
){

totalFields++;

if(
cell.classList.contains("checked")
){
checkedFields++;
}

}

});

if(
checkedFields < totalFields
){

const colorField =
document.querySelector(
'.colorTop[data-color="'+color+'"]'
);

colorField.classList.remove(
"completedBefore"
);

}
  
if(
totalFields>0 &&
totalFields===checkedFields
){

const colorField =
document.querySelector(
'.colorTop[data-color="'+color+'"]'
);

if(
!colorField.classList.contains("completedBefore")
){

const names={
green:"Grün",
yellow:"Gelb",
blue:"Blau",
red:"Rot",
orange:"Orange"
};

showPopup(
names[color] + " abgeschlossen"
);

colorField.classList.add("completedBefore");

}

const topValue =
colorField.querySelector(".topValue");

const bottomValue =
colorField
.nextElementSibling
.querySelector(".bottomValue");

topValue.classList.remove("activeScore");
bottomValue.classList.remove("activeScore");

const crossed =
colorField.classList.contains("cross");

if(crossed){

colorField
.nextElementSibling
.classList.add("colorBoxScored");

}else{

colorField
.classList.add("colorBoxScored");

}

completedColors++;

colorScore+=
crossed
?
colorValues[color].b
:
colorValues[color].t;

}

});

let uncheckedStars=0;

document
.querySelectorAll(".star")
.forEach(star=>{

if(
!star.classList.contains("checked")
){
uncheckedStars++;
}

});

const starPenalty=
uncheckedStars*2;

const bonus = colorScore;
const unusedJokers =
document.querySelectorAll(".joker:not(.used)")
.length;

const exclaim = unusedJokers;

const total=
aoScore+
colorScore+
bonus+
exclaim-
starPenalty;

document
.getElementById("aoScore")
.textContent=
scoreHidden ? "?" : aoScore;

document
.getElementById("bonusScore")
.textContent=
scoreHidden ? "?" : bonus;

document
.getElementById("exclaimScore")
.textContent=
scoreHidden ? "?" : exclaim;

document
.getElementById("starPenalty")
.textContent=
scoreHidden ? "?" : starPenalty;

document
.getElementById("totalScore")
.textContent=
scoreHidden ? "?" : total;

document
.getElementById("endMsg")
.textContent=
completedColors>=2
?
"Spielende erreicht"
:
"";

}

document
.getElementById("resetBtn")
.addEventListener(
"click",
()=>{

if(
!confirm("Spielfeld wirklich zurücksetzen?")
){
return;
}

document
.querySelectorAll(".cell")
.forEach(cell=>{

cell.classList.remove("checked");

cell
.querySelectorAll(".xmark")
.forEach(x=>x.remove());

});

document
.querySelectorAll(".joker")
.forEach(joker=>{
joker.classList.remove("used");
});

document
.querySelectorAll(".topScore")
.forEach(score=>{
score.classList.remove("cross");
});

document
.querySelectorAll(".colorTop")
.forEach(color=>{
color.classList.remove("cross");
});

localStorage.removeItem(
getStorageKey()
);

update();

}
);

.querySelectorAll(".planet")
.forEach(btn=>{

const backgrounds={

.getElementById("eyeBtn")

.getElementById("eyeBtn")

update();

});

buildBoard();

load();

update();

document
.getElementById("menuScreen")
.style.display="none";

document
.getElementById("app")
.style.display="block";

};

});

document
.getElementById("menuBtn")
.addEventListener("click",()=>{

document
.getElementById("app")
.style.display="none";

document
.getElementById("menuScreen")
.style.display="block";

});

buildBoard();
load();
update();


</script>
